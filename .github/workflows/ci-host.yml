name: CI — Host

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:host
      - run: npm run test:phase2
      - run: npm run test:phase4
      - run: npm run test:human-input
      # The clone contract (docs/CONTRACT.md) says to run this in CI. It was
      # not actually wired up until now.
      - run: node --test tests/kit-conformance.test.mjs

  host-integration-tests:
    runs-on: ubuntu-latest
    needs: host-unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t apra-agent-kit-ci .

      - name: Run host, run-loop and jobs suites in Docker
        run: |
          docker run --rm apra-agent-kit-ci \
            sh -c "npm run test:host && npm run test:phase2 && npm run test:phase4 && npm run test:human-input"
